packages:
  - "apps/*"
  - "packages/*"
  - "templates/*"
  - studio-agent

onlyBuiltDependencies:
  - "@vercel/speed-insights"
  - esbuild
  - msw

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

allowBuilds:
  sharp: false

minimumReleaseAgeExclude:
  - "@ai-sdk/*"
  - "@rolldown/*"
  - "@vercel/*"
  - "@workflow/*"
  - ai
  - experimental-ai-sdk-code-mode
  - eve
  - nitro
  - rolldown
  - workflow
